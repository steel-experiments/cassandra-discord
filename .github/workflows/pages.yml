name: Deploy public documentation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - docs/**
      - mkdocs.yml
      - package.json
      - requirements-docs.txt
      - scripts/check-doc-links.mjs
      - scripts/check-public-docs.mjs
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The documentation scripts use Node built-ins only, so no npm install
      # is needed.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Check authored public content
        run: |
          npm run docs:check-public
          npm run docs:check-links

      # External links are checked against third-party sites. This step blocks
      # the deploy on purpose: a dead link in the public docs is a defect. It is
      # a separate step so a failure names the cause.
      - name: Check external documentation links
        run: npm run docs:check-links:external

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build documentation
        run: mkdocs build --strict

      - name: Check generated public artifact
        run: node scripts/check-public-docs.mjs site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
